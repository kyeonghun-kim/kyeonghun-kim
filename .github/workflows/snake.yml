name: Generate Snake

on:
  schedule:
    # 매일 한국시간 새벽 3시 (UTC 18:00)
    - cron: "0 18 * * *"
  workflow_dispatch:   # 액션 탭에서 수동 실행용
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#1A1A1A&color_dots=#EBEBEB,#C4C4C4,#949494,#5C5C5C,#1A1A1A
            assets/snake-dark.svg?color_snake=#EDEDED&color_dots=#21262D,#4A4A4A,#6E6E6E,#A8A8A8,#EDEDED

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/snake-light.svg assets/snake-dark.svg
          git commit -m "chore: update snake" || exit 0
          git push
